name: Publish NuGet Template

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack template
        run: dotnet pack ./Packaging/Asim.CleanArchitecture.Template.csproj -c Release

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ github.actor }}

      - name: Push package
        run: >
          dotnet nuget push
          ./Packaging/bin/Release/Asim.CleanArchitecture.Template.1.0.0.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json